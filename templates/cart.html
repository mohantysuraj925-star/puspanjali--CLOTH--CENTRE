{% extends 'base.html' %}{% block b %}<div class=w><h2>My Bag</h2><div id=items></div><div id=pd class=panel style="display:none"></div><a id=go class="btn gold" style="display:none;width:100%" href="/checkout">Continue to reserve <svg class=ic><use href="#i-arrow"/></svg></a></div>
<script>function load(){fetch('/api/cart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Cart.get())}).then(function(r){return r.json()}).then(function(D){var h='',m=0,t=0;
D.forEach(function(p){m+=p.mrp*p.qty;t+=p.price*p.qty;h+='<div class="row cr">'+(p.img?'<img class=th src="'+(p.img.indexOf('http')==0?p.img:'/uploads/'+p.img)+'">':'')+'<span class=gr><b>'+p.name+'</b><br><small>'+(p.size?'Size: '+p.size+' · ':'')+'₹'+p.price+'</small></span><span class=qty><button onclick="ch(\''+p.key+'\',-1)">-</button> '+p.qty+' <button onclick="ch(\''+p.key+'\',1,'+p.stock+')">+</button></span><b>₹'+p.price*p.qty+'</b></div>'});
items.innerHTML=h||'<p>Your bag is empty. <a href="/">Continue shopping</a></p>';pd.style.display=go.style.display=D.length?'block':'none';
pd.innerHTML='<h3 style="margin-top:0">Price details</h3><div class=rw><span>MRP</span><span>₹'+m+'</span></div><div class=rw><span>Discount</span><span style="color:#6fe3a0">-₹'+(m-t)+'</span></div><div class="rw tt"><b>Total</b><b>₹'+t+'</b></div>'+(m-t>0?'<p style="color:#6fe3a0;margin-bottom:0">You are saving ₹'+(m-t)+' on this order</p>':'')})}
function ch(k,d,mx){var c=Cart.get();if(d>0&&mx&&(c[k]||0)>=mx){toast('Only '+mx+' in stock');return}c[k]=(c[k]||0)+d;if(c[k]<1)delete c[k];Cart.set(c);load()}load()</script>{% endblock %}
