{% extends 'base.html' %}{% block b %}<div class=w><div class=panel><h2 style="margin-top:0">{{'About us' if pg=='about' else 'Visit or contact us'}}</h2>
{% if pg=='about' %}<p style="line-height:1.7">{{S.about}}</p><p style="line-height:1.7">{{S.story}}</p>{% else %}<div class=rw><span><svg class=ic><use href="#i-pin"/></svg> {{S.address}}</span></div><div class=rw><span><svg class=ic><use href="#i-clock"/></svg> {{S.hours}}</span></div><div class=rw><span><svg class=ic><use href="#i-phone"/></svg> <a href="tel:{{S.phone}}">{{S.phone}}</a></span></div><div class=rw><span><svg class=ic><use href="#i-mail"/></svg> <a href="mailto:{{S.email}}">{{S.email}}</a></span></div><a class="btn gold" href="https://wa.me/{{S.whatsapp}}">Chat on WhatsApp</a>{% endif %}</div></div>{% endblock %}
